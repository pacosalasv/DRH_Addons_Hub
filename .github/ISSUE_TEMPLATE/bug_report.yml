name: Repository issue
description: Report a broken link, incorrect listing, or other reproducible problem in the DRH Add-ons Hub.
title: "[Hub]: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Identify the affected product, link, or section and describe what is wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
